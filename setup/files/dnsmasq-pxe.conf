# ---------------------------------------------------------------------------
# dnsmasq als proxyDHCP + TFTP-Server fuer den Bootserver
#
# proxyDHCP heisst: Der vorhandene Router vergibt weiterhin die IP-Adressen.
# dnsmasq antwortet zusaetzlich auf PXE-Anfragen und teilt dem Client nur mit,
# WO er seinen Bootloader findet. Ist diese VM aus, laeuft das LAN unveraendert
# weiter -- es gibt keinen zweiten DHCP-Server, der sich in die Quere kommt.
#
# Diese Datei wird von setup/install.sh mit den echten Werten gerendert.
# Platzhalter: @@INTERFACE@@ @@SERVER_IP@@ @@SUBNET@@
# ---------------------------------------------------------------------------

# Kein DNS-Server -- dnsmasq soll ausschliesslich DHCP/PXE/TFTP machen.
# Ohne das kollidiert dnsmasq mit systemd-resolved auf Port 53.
port=0

# Nur auf dem LAN-Interface lauschen.
interface=@@INTERFACE@@
bind-interfaces

# proxyDHCP-Modus: keine IP-Vergabe, nur Boot-Informationen.
dhcp-range=@@SUBNET@@,proxy

# Manche aeltere/kaputte PXE-ROMs verwirren sich, wenn dnsmasq die Felder
# "servername"/"filename" als zusaetzlichen Optionsraum wiederverwendet.
dhcp-no-override

# PXE-Discovery abschalten (kein Multicast-Suchen, Bootfile sofort laden).
# Das ueberspringt den "Press F8"-Prompt und beschleunigt den Start deutlich.
dhcp-option=vendor:PXEClient,6,2b

# --- Eingebauter TFTP-Server ------------------------------------------------
# TFTP wird nur fuer den allerersten Schritt gebraucht: das PXE-ROM der
# Netzwerkkarte laedt damit iPXE. Alles Weitere laeuft ueber HTTP (viel
# schneller und zuverlaessiger als TFTP).
enable-tftp
tftp-root=/srv/pxe/tftp
tftp-no-fail

# --- iPXE-Erkennung ---------------------------------------------------------
# Ein bereits gestartetes iPXE meldet seine Faehigkeiten in DHCP-Option 175.
# Daran erkennen wir "das ist schon iPXE" und schicken es zum HTTP-Skript,
# statt ihm erneut iPXE unterzuschieben (das waere eine Boot-Schleife).
dhcp-match=set:ipxe-http,175,19
dhcp-match=set:ipxe-menu,175,39
dhcp-match=set:ipxe-pxe,175,33
dhcp-match=set:ipxe-bzimage,175,24
dhcp-match=set:ipxe-iscsi,175,17
dhcp-match=set:ipxe-efi,175,36

# "ipxe-ok" nur setzen, wenn iPXE wirklich alles kann, was wir brauchen.
# BIOS-Variante: http + menu + iscsi + pxe + bzimage
# UEFI-Variante: http + menu + iscsi + efi
tag-if=set:ipxe-ok,tag:ipxe-http,tag:ipxe-menu,tag:ipxe-iscsi,tag:ipxe-pxe,tag:ipxe-bzimage
tag-if=set:ipxe-ok,tag:ipxe-http,tag:ipxe-menu,tag:ipxe-iscsi,tag:ipxe-efi

# --- Schritt 1: normales PXE-ROM -> iPXE per TFTP ---------------------------
# Im proxyDHCP-Modus muss das ueber pxe-service laufen (erzeugt die noetige
# Option 43). Die TFTP-Server-IP am Ende ist Pflicht.
pxe-service=tag:!ipxe-ok,X86PC,"PXE Boot (BIOS)",undionly.kpxe,@@SERVER_IP@@
pxe-service=tag:!ipxe-ok,IA32_EFI,"PXE Boot (UEFI 32)",snponlyx32.efi,@@SERVER_IP@@
pxe-service=tag:!ipxe-ok,BC_EFI,"PXE Boot (UEFI)",snponly.efi,@@SERVER_IP@@
pxe-service=tag:!ipxe-ok,X86-64_EFI,"PXE Boot (UEFI 64)",snponly.efi,@@SERVER_IP@@

# --- Schritt 2: iPXE -> unser HTTP-Bootskript -------------------------------
# Spaetere Regeln ueberschreiben fruehere, deshalb steht diese Zeile zuletzt.
# Die Server-Adresse (0.0.0.1) muss ungleich null sein, wird aber nie benutzt,
# weil das Skript per HTTP und nicht per TFTP geholt wird.
dhcp-boot=tag:ipxe-ok,http://@@SERVER_IP@@/boot.ipxe,,0.0.0.1

# --- Logging ----------------------------------------------------------------
# Beim Einrichten sehr hilfreich: sudo journalctl -u dnsmasq -f
# Wenn alles laeuft, kann log-dhcp auskommentiert werden.
log-dhcp
