# Von install.sh erzeugt -- Aenderungen gehen beim naechsten Lauf verloren.
#
# Diese Datei wird aus /etc/samba/smb.conf mit "include" eingebunden und
# haengt eine einzige Freigabe an: die ausgepackten Abbilder, nur lesend.
#
# Wozu ueberhaupt SMB, wo doch schon HTTP und NFS laufen?
#
#   Das Windows-Setup laedt seine Quelldateien -- vor allem die mehrere
#   Gigabyte grosse install.wim -- ausschliesslich ueber SMB nach. Ueber
#   HTTP holt es nichts, und NFS spricht es nicht. Ohne diese Freigabe
#   startet zwar die WinPE-Konsole, aber es laesst sich nichts damit
#   installieren.
#
# Warum ein Benutzer und kein Gastzugang?
#
#   Weil Windows seit Version 10 (Build 1709) den unangemeldeten
#   Gastzugang auf SMB2 und SMB3 von sich aus abschaltet -- auf der
#   *Client*seite. Eine offene Freigabe wuerde also nicht etwa unsicher
#   funktionieren, sondern gar nicht: Der Rechner lehnt sie ab, und die
#   Meldung nennt den Grund nicht. Der Ausweg waere, in WinPE
#   "EnableInsecureGuestLogons" zu setzen -- das verlangt einen Eingriff
#   ins Abbild und schaltet die SMB-Signierung ab. Ein Benutzer mit
#   Passwort ist der geradere Weg.
#
# Zum Passwort:
#
#   Es steht im Klartext in /etc/pxeweb.env und wird in der Oberflaeche
#   angezeigt -- wer im LAN ist, kann es lesen. Das ist vertretbar, weil
#   diese Freigabe **nur lesend** ist und nichts enthaelt, was nicht
#   ohnehin von den Herstellern zum Herunterladen angeboten wird:
#   Installationsmedien. Es ist ausdruecklich **kein** Konto, unter dem
#   sich etwas aendern liesse, und es hat keine Anmeldeshell.
#   Was hier NICHT hineingehoert, sind eigene Dateien.

[global]
   # Nur im eigenen Netz erreichbar -- dieselbe Grenze wie beim NFS-Export.
   hosts allow = @@SUBNET@@ 127.0.0.1
   hosts deny = 0.0.0.0/0

   # SMB1 ist abgeschaltet: veraltet, und WinPE braucht es nicht.
   server min protocol = SMB2
   security = user
   # Kein stiller Rueckfall auf einen Gast, wenn das Passwort falsch ist --
   # sonst sieht ein Tippfehler wie ein kaputtes Abbild aus.
   map to guest = never

   # Der Server bietet keine Drucker an und soll auch nicht danach suchen.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[install]
   comment = Installationsquellen (nur lesend)
   path = @@ASSETS@@
   browseable = yes
   read only = yes
   guest ok = no
   valid users = @@BENUTZER@@

   # Ohne diese Zeile laesst sich setup.exe nicht starten, obwohl der
   # Ordner sich oeffnen und die Datei sich kopieren laesst.
   #
   # Der Grund: Samba erlaubt das Ausfuehren einer Datei nur, wenn sie das
   # POSIX-x-Bit traegt. Die ausgepackten Abbilder tragen es nicht --
   # uploads.py legt Dateien mit 0644 ab (_lesbar_machen), und das ist
   # richtig so: Es sind Windows-Binaerdateien, die dieser Linux-Server
   # niemals selbst ausfuehrt. Ihnen das x-Bit zu geben, nur damit ein
   # anderer Rechner sie starten darf, waere die falsche Stelle.
   #
   # Diese Option trennt genau das: auf dem Server nicht ausfuehrbar, ueber
   # die Freigabe schon. Die Freigabe ist ohnehin nur lesend.
   acl allow execute always = yes

# Debian gibt ab Werk die Heimatverzeichnisse und die Drucker frei. Beides
# hat auf einem Bootserver nichts zu suchen -- ein spaeter genannter
# Abschnitt gewinnt, deshalb werden sie hier abgeschaltet.
[homes]
   available = no

[printers]
   available = no

[print$]
   available = no
