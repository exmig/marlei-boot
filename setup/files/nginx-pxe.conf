# ---------------------------------------------------------------------------
# nginx als Auslieferer fuer Boot-Dateien + Reverse Proxy fuer die Web-UI
#
# Warum nginx und nicht der Python-Server direkt?
# Kernel, Initrd und Squashfs-Dateien sind hunderte MB gross. Die liefert
# nginx mit sendfile() praktisch ohne CPU-Last aus, waehrend uvicorn dabei
# blockieren wuerde. Die Web-App macht nur noch die kleinen Skripte.
#
# Platzhalter: @@SERVER_IP@@
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ISO-Uploads ueber die Weboberflaeche brauchen das.
    client_max_body_size 16G;

    access_log /var/log/nginx/pxe-access.log;
    error_log  /var/log/nginx/pxe-error.log;

    # --- Boot-Dateien: Kernel, Initrd, Squashfs, entpackte ISOs -------------
    location /assets/ {
        alias /srv/pxe/assets/;
        autoindex on;

        sendfile on;
        tcp_nopush on;
        sendfile_max_chunk 1m;

        # Initrds sind bereits komprimiert -- nochmal gzip kostet nur CPU.
        gzip off;
    }

    # --- Die iPXE-Binaries auch per HTTP (fuer den USB-Stick spaeter) -------
    location /tftp/ {
        alias /srv/pxe/tftp/;
        autoindex on;
    }

    # --- Upload eigener ISO-Abbilder ----------------------------------------
    # Ohne "proxy_request_buffering off" wuerde nginx die ganzen Gigabyte erst
    # in eine eigene Zwischendatei schreiben und die Anwendung bekaeme sie erst
    # danach zu sehen: doppelter Plattenverbrauch, und im Browser stuende der
    # Fortschrittsbalken lange bei 100 %, waehrend in Wahrheit noch kopiert wird.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Ein Abbild ueber WLAN hochzuladen dauert; die Vorgabe von 60 s
        # wuerde die Verbindung mittendrin kappen.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Alles andere: die Web-Anwendung ------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # iPXE ist beim Warten auf Antworten weniger geduldig als ein Browser.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
